id: hydra-ssh-101
name: Hydra Lab
description: Simulated Kali desktop. Brute-force the Nirs Central Bank staff portal with Hydra.
difficulty: beginner
category: Brute Force
status: AVAILABLE
estimated_duration_minutes: 20
time_limit_seconds: 1200
required_tools:
  - nmap
  - hydra
  - firefox
tasks:
  - id: recon
    title: Nmap recon
    description: Scan the training target.
    points: 20
  - id: identify
    title: Identify the web login
    description: Confirm HTTP on port 80 and open the portal.
    points: 15
  - id: hydra
    title: Run Hydra
    description: Attack the portal login with a wordlist.
    points: 30
  - id: creds
    title: Recover credentials
    description: Sign in to the virtual site with the found password.
    points: 15
  - id: submit
    title: Submit flag
    description: Submit the flag issued to this session.
    points: 20
browser_requirements:
  - chrome
terminal_requirements:
  - kali
